name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper is committed (it is a binary jar, awkward to add from a phone),
      # so CI installs the Gradle version that the Android plugin needs (8.9+).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Core unit tests
        run: gradle :core:test

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TilePaint-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # A release has a plain download link, which is much easier to open on a phone
      # than a zipped workflow artifact.
      - name: Publish the APK to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TilePaint-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TilePaint-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Built from commit ${GITHUB_SHA::7}"
