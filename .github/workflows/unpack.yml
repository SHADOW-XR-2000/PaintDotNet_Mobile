name: Unpack zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -q tilepaint.zip -d tmp
          cp -r tmp/tilepaint/. .
          rm -rf tmp tilepaint.zip
          mv .github/workflows/android.yml android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project"
          git push
